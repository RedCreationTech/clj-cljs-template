# 本地 MySQL(可选):bb test:mysql 会自动 `docker compose up -d mysql`
# 手动使用:docker compose up -d mysql 后
#   JDBC_URL="jdbc:mysql://127.0.0.1:3308/ruoyi?user=root&password=password&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai" \
#   MIGRATION_DIR=migrations bb dev
services:
  mysql:
    image: mysql:8.4
    container_name: ruoyi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ruoyi
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppassword", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
